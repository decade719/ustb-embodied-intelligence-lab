<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="USTB具身智能实验室合作伙伴：携手产业、学界与社区伙伴，共建开放生态与可持续发展。" />
  <title>合作伙伴 - USTB 具身智能实验室</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="theme-huaqin grain partners-page">

  <!-- 全站氛围光斑 -->
  <div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>

  <header class="site-header theme-huaqin">
    <div class="container">
      <a class="logo" href="index.html" data-i18n="nav.brand">USTB具身智能实验室</a>
      <nav class="nav" id="mainNav">
        <button class="nav-toggle" aria-label="打开菜单" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
        <ul class="nav-list">
          <li><a href="index.html" data-i18n="nav.home">首页</a></li>
          <li><a href="cases.html" data-i18n="cases_title">科研成果</a></li>
          <li><a href="members.html" data-i18n="members_title">成员介绍</a></li>
          <li><a href="partners.html" class="active" data-i18n="partners_title">合作伙伴</a></li>
          <li><a href="contact.html" data-i18n="nav.contact">联系方式</a></li>
        </ul>
        <div class="tools">
          <select id="langSwitcher" aria-label="语言切换">
            <option value="zh-CN">简体中文</option>
            <option value="zh-HK">繁體中文</option>
            <option value="en">English</option>
          </select>
          <button id="themeToggle" data-i18n="toolbar.theme">深色</button>
        </div>
      </nav>
    </div>
  </header>

  <main>
    <!-- 页首 -->
    <section class="page-hero">
      <div class="decor decor-a"></div>
      <div class="decor decor-b"></div>
      <div class="container">
        <div class="eyebrow">Partners · 生态合作</div>
        <h1>合作伙伴</h1>
        <p class="lead">携手产业、学界与社区伙伴，共建开放生态与可持续发展</p>
      </div>
    </section>

    <!-- 生态合作 -->
    <section id="partners" class="section alt">
      <div class="container">
        <div style="text-align:center;">
          <h2 class="section-title">生态合作</h2>
        </div>
        <div style="display:flex; justify-content:center; margin-top:38px;">
          <article class="card reveal" style="max-width:420px; width:100%;">
            <div class="card-media" onclick="openImageModal('pictures/29.webp','深维科技公司')"><img src="pictures/29.webp" alt="深维科技公司" loading="lazy" /></div>
            <h3>深维科技公司</h3>
            <p>技术合作与产业应用，共同推进具身智能技术发展。</p>
          </article>
        </div>
      </div>
    </section>

    <!-- 寻求合作伙伴 -->
    <section class="cta-band">
      <div class="decor decor-c"></div>
      <div class="container">
        <div class="eyebrow">Join Us · 寻求合作</div>
        <h2>寻求合作伙伴</h2>
        <p>我们诚邀产业伙伴、高校机构、技术服务商共同探索智能机器人领域的创新机会。<br />无论是技术合作、市场拓展还是学术交流，都欢迎与我们联系！</p>
        <div class="cta">
          <a class="btn btn-primary" href="contact.html">联系我们 →</a>
          <a class="btn btn-ghost" href="cases.html">了解科研成果</a>
        </div>
      </div>
    </section>
  </main>

  <footer class="sub-footer">
    <div class="container">© USTB 具身智能实验室 · 北京科技大学</div>
  </footer>

  <!-- 图片查看器 -->
  <div id="imageModal" class="modal" role="dialog" aria-modal="true" onclick="closeImageModal()">
    <div class="modal-box" onclick="event.stopPropagation()">
      <button class="modal-close" onclick="closeImageModal()" aria-label="关闭">✕</button>
      <img id="modalImage" src="" alt="" />
      <div id="modalImageTitle" class="modal-title"></div>
    </div>
  </div>

  <script src="script.js"></script>
  <script>
    function openImageModal(imageSrc, imageTitle) {
      const modal = document.getElementById('imageModal');
      const modalImage = document.getElementById('modalImage');
      const modalImageTitle = document.getElementById('modalImageTitle');
      modalImage.src = imageSrc;
      modalImage.alt = imageTitle;
      modalImageTitle.textContent = imageTitle;
      modal.classList.add('open');
      document.body.style.overflow = 'hidden';
    }
    function closeImageModal() {
      document.getElementById('imageModal').classList.remove('open');
      document.body.style.overflow = '';
    }
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') closeImageModal();
    });
  </script>
</body>
</html>
