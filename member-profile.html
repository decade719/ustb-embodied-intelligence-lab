      document.getElementById('modalTitle').textContent = title;
      document.getElementById('modalMessage').textContent = message;
      document.getElementById('customModal').classList.add('open');
      document.body.style.overflow = 'hidden';
    }
    function closeModal() {
      document.getElementById('customModal').classList.remove('open');
      document.body.style.overflow = '';
    }
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { closeModal(); }
    });
    document.getElementById('customModal').addEventListener('click', function (e) {
      if (e.target === this) { closeModal(); }

    // 徽章配色：按职称映射到设计系统的彩色徽章
    function badgeVariant(member) {
      const t = member.title || '';
      if (t.includes('教授')) return 'gold';
      if (t.includes('博士')) return 'blue';
      if (t.includes('硕士')) return 'green';
      return 'violet';
    }

    // 从URL获取成员ID
    const urlParams = new URLSearchParams(window.location.search);
    const memberId = urlParams.get('id');

    if (memberId && membersData[memberId]) {
      const member = membersData[memberId];

      // 设置页面标题
      document.getElementById('pageTitle').textContent = `${member.name} - USTB 具身智能实验室`;

      // 头像
      document.getElementById('avatarContainer').innerHTML =
        `<img src="${member.avatar}" alt="${member.name}">`;

      // 职位徽章
      document.getElementById('positionBadge').innerHTML =
        `<span class="pill ${badgeVariant(member)}">${member.position}</span>`;

      // 基本信息
      document.getElementById('memberName').textContent = member.name;
      document.getElementById('memberTitle').textContent = member.title + ' · ' + member.description;

      // 统计胶囊（如有）
      if (Array.isArray(member.stats) && member.stats.length) {
        document.getElementById('memberStats').innerHTML =
          `<div class="stat-pills" style="justify-content:flex-start; margin-top:22px;">` +
          member.stats.map(s => `<div class="stat-pill"><b>${s.value}</b><span>${s.label}</span></div>`).join('') +
          `</div>`;
      }

      // 研究方向
      document.getElementById('researchAreas').innerHTML = `
        <div class="grid cols-2" style="margin-top:26px;">
          ${member.researchAreas.map((area, i) => `
            <div class="card" style="--d:${i * 0.06}s">
              <div class="perk-ico" style="width:54px;height:54px;font-size:27px;">${area.icon}</div>
              <h3>${area.title}</h3>
              <p>${area.desc}</p>
            </div>
          `).join('')}
        </div>
      `;

      // 主要成果
      document.getElementById('achievements').innerHTML = `
        <ul class="num-list">
          ${member.achievements.map(a => `<li>${a}</li>`).join('')}
        </ul>
      `;

      // 项目经历
      document.getElementById('projects').innerHTML = `
        <div class="proj-list">
          ${member.projects.map(project => `
            <div class="proj">
              <div class="proj-head">
                <h3>${project.name}</h3>
                <span class="pill violet">${project.year}</span>
              </div>
              ${project.role ? `
                <div class="proj-role">
                  <span class="pill blue">担任角色</span>
                  <span>${project.role}</span>
                </div>` : ''}
              <p>${project.desc}</p>
            </div>
          `).join('')}
        </div>
      `;

      // 代表性成果
      document.getElementById('publications').innerHTML = `
        <ul class="num-list">
          ${member.publications.map(pub => `<li>${pub}</li>`).join('')}
        </ul>
      `;

      // 联系方式
      const contactLabels = {
        email: '邮箱', office: '办公室', phone: '电话', github: 'GitHub',
        wechat: '微信', scholar: 'Google Scholar', portfolio: '个人主页',
        department: '系所', school: '学院', university: '大学', position: '职位'
      };
      const contactRows = Object.entries(member.contact).map(([key, value]) => {
        let v = `<strong>${value}</strong>`;
        if (key === 'email') v = `<a href="mailto:${value}">${value}</a>`;
        else if (key === 'github' || key === 'scholar' || key === 'portfolio') v = `<a href="https://${value}" target="_blank" rel="noopener noreferrer">${value}</a>`;
        return `<li><span class="k">${contactLabels[key] || key}</span><span class="v">${v}</span></li>`;
      }).join('');
      const externalLinkHTML = member.externalLink ? `
        <div class="cta" style="margin-top:26px;">
          <a class="btn btn-primary" href="${member.externalLink}" target="_blank" rel="noopener noreferrer">🔗 访问官网个人主页</a>
        </div>
      ` : '';
      document.getElementById('contactInfo').innerHTML =
        `<ul class="info-rows" style="margin-top:6px;">${contactRows}</ul>${externalLinkHTML}`;

    } else {
      // 未找到成员
      document.getElementById('memberProfile').innerHTML = `
        <section style="min-height:64vh; display:flex; align-items:center; justify-content:center; padding:120px 20px 60px;">
