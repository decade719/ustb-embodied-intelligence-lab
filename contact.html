<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>联系我们 - USTB 具身智能实验室</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="form-submission-manager.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      height: 100%;
    }
    
    #fullpage-wrapper {
      height: 100vh;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      scroll-behavior: smooth;
      /* 隐藏滚动条 */
      scrollbar-width: none; /* Firefox */
      -ms-overflow-style: none; /* IE and Edge */
    }
    
    #fullpage-wrapper::-webkit-scrollbar {
      display: none; /* Chrome, Safari, Opera */
    }
    
    .fp-section {
      height: 100vh;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      position: relative;
      overflow: hidden;
    }
    
    /* 隐藏表单容器内的滚动条 */
    .form-container::-webkit-scrollbar {
      display: none; /* Chrome, Safari, Opera */
    }
  </style>
</head>
<body class="theme-huaqin">
  <!-- 顶部导航 -->
  <header class="site-header theme-huaqin" style="position: fixed; top: 0; left: 0; right: 0; z-index: 10000;">
    <div class="container">
      <a class="logo" href="index.html" data-i18n="nav.brand">北京科技大学具身智能实验室</a>
      <nav class="nav" id="mainNav">
        <button class="nav-toggle" aria-label="toggle menu" onclick="document.getElementById('mainNav').dataset.open = document.getElementById('mainNav').dataset.open === 'true' ? 'false' : 'true'">
          <span></span><span></span><span></span>
        </button>
        <ul class="nav-list">
          <li><a href="index.html" data-i18n="nav.home">首页</a></li>
          <li><a href="cases.html" data-i18n="cases_title">科研成果</a></li>
          <li><a href="members.html" data-i18n="members_title">成员介绍</a></li>
          <li><a href="partners.html" data-i18n="partners_title">合作伙伴</a></li>
          <li><a href="contact.html" data-i18n="nav.contact">联系方式</a></li>
        </ul>
        <div class="tools">
          <select id="langSwitcher" aria-label="language">
            <option value="zh-CN">简体中文</option>
            <option value="zh-HK">繁体中文</option>
            <option value="en-us">English</option>
          </select>
          <button id="themeToggle" data-i18n="theme_toggle">🌙</button>
        </div>
      </nav>
    </div>
  </header>

  <div id="fullpage-wrapper">
    <!-- 联系我们 -->
    <section class="fp-section" data-anchor="contact" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 80px 0 20px; height: 100vh; display: flex; align-items: center; overflow: hidden;">
      <div class="container" style="max-width: 1200px; width: 100%;">
        <div style="text-align: center; margin-bottom: 20px; color: white;">
          <h1 style="font-size: 40px; font-weight: 800; margin-bottom: 8px; text-shadow: 0 2px 8px rgba(0,0,0,0.2);">联系我们</h1>
          <p style="font-size: 16px; opacity: 0.95;">Join Our Team · 加入我们一起探索人工智能的未来</p>
        </div>

        <div class="form-container" style="background: white; border-radius: 24px; padding: 32px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); max-width: 800px; margin: 0 auto; max-height: calc(100vh - 200px); overflow-y: auto; scrollbar-width: none; -ms-overflow-style: none;">
          
          <!-- 统一联系表单 -->
          <form id="contactForm" onsubmit="submitContact(event)">
            <h2 style="font-size: 24px; font-weight: 800; color: #1f2937; margin-bottom: 6px; text-align: center;">联系与合作</h2>
            <p style="text-align: center; color: #6b7280; margin-bottom: 20px; font-size: 14px;">无论是学术交流、加入实验室还是项目合作，我们都期待与您建立联系</p>

            <div style="display: grid; gap: 14px;">
              <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                <div>
                  <label style="display: block; color: #374151; font-weight: 600; margin-bottom: 8px;">
                    <span style="color: #dc2626;">*</span> 姓名
                  </label>
                  <input type="text" name="name" required placeholder="请输入您的姓名"
                    style="width: 100%; padding: 14px 16px; border: 2px solid #e5e7eb; border-radius: 12px; font-size: 15px; transition: all 0.3s; outline: none;"
                    onfocus="this.style.borderColor='#667eea'; this.style.boxShadow='0 0 0 3px rgba(102,126,234,0.1)'"
                    onblur="this.style.borderColor='#e5e7eb'; this.style.boxShadow='none'" />
                </div>

                <div>
                  <label style="display: block; color: #374151; font-weight: 600; margin-bottom: 8px;">
                    <span style="color: #dc2626;">*</span> 邮箱
                  </label>
                  <input type="email" name="email" required placeholder="your@email.com"
                    style="width: 100%; padding: 14px 16px; border: 2px solid #e5e7eb; border-radius: 12px; font-size: 15px; transition: all 0.3s; outline: none;"
                    onfocus="this.style.borderColor='#667eea'; this.style.boxShadow='0 0 0 3px rgba(102,126,234,0.1)'"
                    onblur="this.style.borderColor='#e5e7eb'; this.style.boxShadow='none'" />
                </div>
              </div>

              <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                <div>
                  <label style="display: block; color: #374151; font-weight: 600; margin-bottom: 8px;">
                    手机号（选填）
                  </label>
                  <input type="tel" name="phone" placeholder="138-xxxx-xxxx"
                    style="width: 100%; padding: 14px 16px; border: 2px solid #e5e7eb; border-radius: 12px; font-size: 15px; transition: all 0.3s; outline: none;"
                    onfocus="this.style.borderColor='#667eea'; this.style.boxShadow='0 0 0 3px rgba(102,126,234,0.1)'"
                    onblur="this.style.borderColor='#e5e7eb'; this.style.boxShadow='none'" />
                </div>

                <div>
                  <label style="display: block; color: #374151; font-weight: 600; margin-bottom: 8px;">
                    <span style="color: #dc2626;">*</span> 咨询类型
                  </label>
                  <select name="type" required
                    style="width: 100%; padding: 14px 16px; border: 2px solid #e5e7eb; border-radius: 12px; font-size: 15px; transition: all 0.3s; outline: none; background: white;"
                    onfocus="this.style.borderColor='#667eea'; this.style.boxShadow='0 0 0 3px rgba(102,126,234,0.1)'"
                    onblur="this.style.borderColor='#e5e7eb'; this.style.boxShadow='none'">
                    <option value="">请选择联系目的</option>
                    <option value="加入实验室">加入实验室（招生/招聘）</option>
                    <option value="学术交流">学术交流</option>
                    <option value="项目合作">项目合作</option>
                    <option value="其他">其他</option>
                  </select>
                </div>
              </div>

              <div>
                <label style="display: block; color: #374151; font-weight: 600; margin-bottom: 8px;">
                  <span style="color: #dc2626;">*</span> 详细内容
                </label>
                <textarea name="content" required rows="4" placeholder="请详细描述您的背景、意向或合作需求..."
                  style="width: 100%; padding: 14px 16px; border: 2px solid #e5e7eb; border-radius: 12px; font-size: 15px; transition: all 0.3s; outline: none; resize: vertical;"
                  onfocus="this.style.borderColor='#667eea'; this.style.boxShadow='0 0 0 3px rgba(102,126,234,0.1)'"
                  onblur="this.style.borderColor='#e5e7eb'; this.style.boxShadow='none'"></textarea>
              </div>

              <div>
                <label style="display: block; color: #374151; font-weight: 600; margin-bottom: 8px;">
                  附件/简历（可选）
                </label>
                <input type="file" name="attachment" accept=".pdf,.doc,.docx,.zip"
                  style="width: 100%; padding: 14px 16px; border: 2px solid #e5e7eb; border-radius: 12px; font-size: 15px; transition: all 0.3s; outline: none; background: white;"
                  onfocus="this.style.borderColor='#667eea'; this.style.boxShadow='0 0 0 3px rgba(102,126,234,0.1)'"
                  onblur="this.style.borderColor='#e5e7eb'; this.style.boxShadow='none'" />
                <p style="font-size: 13px; color: #9ca3af; margin-top: 6px;">支持格式：PDF, DOC, DOCX, ZIP，文件大小不超过10MB</p>
              </div>

              <button type="submit"
                style="width: 100%; background: var(--gradient); color: white; padding: 16px; border: none; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; transition: all 0.3s; box-shadow: 0 4px 16px rgba(102,126,234,0.4); margin-top: 8px;"
                onmouseover="this.style.transform='translateY(-2px)'; this.style.boxShadow='0 6px 24px rgba(102,126,234,0.5)'"
                onmouseout="this.style.transform='translateY(0)'; this.style.boxShadow='0 4px 16px rgba(102,126,234,0.4)'">
                发送消息
              </button>
            </div>
          </form>
        </div>
      </div>
    </section>
  </div>

  <script>
    // 表单切换
    function switchForm(type) {
      const messageForm = document.getElementById('messageForm');
      const resumeForm = document.getElementById('resumeForm');
      const btnMessage = document.getElementById('btn-message');
      const btnResume = document.getElementById('btn-resume');

      if (type === 'message') {
        messageForm.style.display = 'block';
        resumeForm.style.display = 'none';
        btnMessage.style.background = 'white';
        btnMessage.style.color = 'var(--primary)';
        btnMessage.style.border = 'none';
        btnMessage.style.boxShadow = '0 4px 16px rgba(0,0,0,0.2)';
        btnResume.style.background = 'rgba(255,255,255,0.2)';
        btnResume.style.color = 'white';
        btnResume.style.border = '2px solid white';
        btnResume.style.boxShadow = 'none';
      } else {
        messageForm.style.display = 'none';
        resumeForm.style.display = 'block';
        btnResume.style.background = 'white';
        btnResume.style.color = 'var(--primary)';
        btnResume.style.border = 'none';
        btnResume.style.boxShadow = '0 4px 16px rgba(0,0,0,0.2)';
        btnMessage.style.background = 'rgba(255,255,255,0.2)';
        btnMessage.style.color = 'white';
        btnMessage.style.border = '2px solid white';
        btnMessage.style.boxShadow = 'none';
      }
    }

    // 留言提交
    function submitMessage(e) {
      e.preventDefault();
      const formData = new FormData(e.target);
      const data = Object.fromEntries(formData);
      
      // 保存到 localStorage
      if (window.formSubmissionManager) {
        window.formSubmissionManager.saveMessage(data);
        alert('✅ 感谢您的留言！我们已收到您的消息，会尽快回复您。');
      } else {
        alert('❌ 系统错误，请稍后再试。');
        console.error('FormSubmissionManager not found');
      }
      
      e.target.reset();
    }

    // 简历提交
    function submitResume(e) {
      e.preventDefault();
      const formData = new FormData(e.target);
      const data = Object.fromEntries(formData);
      
      // 处理文件上传（仅保存文件名，实际文件需要后端处理）
      const fileInput = e.target.querySelector('input[type="file"]');
      if (fileInput && fileInput.files.length > 0) {
        data.resumeFile = fileInput.files[0].name;
      }
      
      // 统一字段名
      if (data.intro) {
        data.introduction = data.intro;
      }
      
      // 保存到 localStorage
      if (window.formSubmissionManager) {
        window.formSubmissionManager.saveResume(data);
        alert('✅ 简历已成功提交！我们会仔细审阅并尽快与您联系。');
      } else {
        alert('❌ 系统错误，请稍后再试。');
        console.error('FormSubmissionManager not found');
      }
      
      e.target.reset();
    }
  </script>
</body>
</html>
